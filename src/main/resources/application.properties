spring.application.name=rental-backend

# Supabase PostgreSQL. On Render use the Session pooler (Supabase dashboard >
# Connect > Session pooler, port 5432) -- the direct db.<ref>.supabase.co host
# is IPv6-only, and the Transaction pooler (port 6543) breaks prepared
# statements and the SELECT ... FOR UPDATE booking lock:
#   DB_URL=jdbc:postgresql://aws-0-<region>.pooler.supabase.com:5432/postgres?sslmode=require
#   DB_USERNAME=postgres.<project-ref>
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/rentalshop}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}

# One-time copy of the old Aiven MySQL data into this database on startup
# (migration/MysqlImportRunner). See postgreSQL_migration/README.md. Remove
# these settings once the log says MYSQL_IMPORT_DONE.
#   MYSQL_IMPORT_URL=jdbc:mysql://<aiven-host>:<port>/defaultdb?sslMode=REQUIRED
# replace-existing=true empties tables that already have rows before importing.
app.mysql-import.enabled=${MYSQL_IMPORT_ENABLED:false}
app.mysql-import.url=${MYSQL_IMPORT_URL:}
app.mysql-import.username=${MYSQL_IMPORT_USER:}
app.mysql-import.password=${MYSQL_IMPORT_PASSWORD:}
app.mysql-import.replace-existing=${MYSQL_IMPORT_REPLACE_EXISTING:false}

spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1200000

# NOTE: switched from `validate` to `update` for local dev/testing so
# Hibernate creates/updates tables itself from the @Entity classes and
# schema.sql doesn't need to be run by hand. Functionally equivalent for
# everything the app itself does (same tables/columns/FKs, and critically
# the same unique constraint on idempotency_key) -- what it does NOT
# reproduce is schema.sql's DB-level guardrails that sit outside the app's
# own logic: ON DELETE CASCADE, CHECK constraints on status columns, and
# the two idx_* performance indexes. None of those are reachable through
# normal use of the app (it only ever writes through JPA), so this is safe
# for dev. Switch back to `validate` (and run schema.sql once) before a
# real/production deployment -- `update` has no migration history and can
# drift silently in ways a real migration tool would catch.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

spring.sql.init.mode=never

# Free-tier Render instances are heavily CPU-throttled, and full eager
# initialization (JPA/Hibernate bootstrap, Firebase, component scan) can take
# well over a minute there even though it's ~8s locally -- long enough that
# Render's port-scan gives up and kills the container before Tomcat ever
# binds. Lazy init lets Tomcat open the port first; every other bean is
# created on first use instead of at startup.
spring.main.lazy-initialization=true

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

app.device.setup-key=${DEVICE_SETUP_KEY:founder}

app.image.webp-quality=${IMAGE_WEBP_QUALITY:0.75}

# The shop's own time zone, used to decide what "today" means for the
# reminder lists (GET /api/reminders). Must be set explicitly: a cloud host
# runs on UTC, whose date is still yesterday's until 05:30 IST.
app.reminders.zone=${REMINDERS_ZONE:Asia/Kolkata}

app.push.provider=${PUSH_PROVIDER:none}

# No default -- a real service-account blob belongs only in Render's env
# vars, never compiled into the jar. Missing this env var with
# PUSH_PROVIDER=fcm now fails startup loudly (FirebaseCloudMessagingSender's
# constructor already throws IllegalStateException for a blank value)
# instead of silently shipping a real secret in the build artifact.
app.fcm.credentials-base64=${FCM_CREDENTIALS_BASE64}

app.redundant-trail.telegram.enabled=${REDUNDANT_TRAIL_TELEGRAM_ENABLED:false}
app.redundant-trail.telegram.bot-token=${TELEGRAM_BOT_TOKEN:}
app.redundant-trail.telegram.chat-id=${TELEGRAM_CHAT_ID:}

app.redundant-trail.sheets.enabled=${REDUNDANT_TRAIL_SHEETS_ENABLED:false}
app.redundant-trail.sheets.spreadsheet-id=${SHEETS_SPREADSHEET_ID:}
app.redundant-trail.sheets.sheet-name=${SHEETS_SHEET_NAME:AuditTrail}
app.redundant-trail.sheets.credentials-base64=${SHEETS_CREDENTIALS_BASE64:}

app.redundant-trail.retry.max-attempts=${REDUNDANT_TRAIL_MAX_ATTEMPTS:5}
app.redundant-trail.retry.fixed-delay-ms=${REDUNDANT_TRAIL_RETRY_DELAY_MS:300000}

app.storage.provider=${STORAGE_PROVIDER:local}

app.storage.local.dir=${STORAGE_LOCAL_DIR:./uploads}
app.storage.local.public-base-url=${STORAGE_LOCAL_PUBLIC_BASE_URL:http://localhost:8080/uploads}

# No default here either -- same reasoning as the FCM key above.
app.storage.imagekit.private-key=${STORAGE_IMAGEKIT_PRIVATE_KEY}
app.storage.imagekit.url-endpoint=${STORAGE_IMAGEKIT_URL_ENDPOINT:https://ik.imagekit.io/n10sj2wm2}

server.port=${PORT:8080}

management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# Startup cleanup: permanently delete bookings that were cancelled under the old
# soft-cancel behaviour (plus their payments and audit history). Irreversible --
# set to false to skip it, e.g. until you've taken a DB backup.
app.purge-cancelled-bookings=${PURGE_CANCELLED_BOOKINGS:true}
