spring.application.name=rental-backend

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/rentalshop?useSSL=false&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1200000

# NOTE: switched from `validate` to `update` for local dev/testing so
# Hibernate creates/updates tables itself from the @Entity classes and
# schema.sql doesn't need to be run by hand. Functionally equivalent for
# everything the app itself does (same tables/columns/FKs, and critically
# the same unique constraint on idempotency_key) -- what it does NOT
# reproduce is schema.sql's DB-level guardrails that sit outside the app's
# own logic: ON DELETE CASCADE, CHECK constraints on status columns, and
# the two idx_* performance indexes. None of those are reachable through
# normal use of the app (it only ever writes through JPA), so this is safe
# for dev. Switch back to `validate` (and run schema.sql once) before a
# real/production deployment -- `update` has no migration history and can
# drift silently in ways a real migration tool would catch.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

spring.sql.init.mode=never

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

app.device.setup-key=${DEVICE_SETUP_KEY:founder}

app.image.webp-quality=${IMAGE_WEBP_QUALITY:0.75}

app.push.provider=${PUSH_PROVIDER:none}

app.fcm.credentials-base64=${FCM_CREDENTIALS_BASE64}
app.redundant-trail.telegram.enabled=${REDUNDANT_TRAIL_TELEGRAM_ENABLED:false}
app.redundant-trail.telegram.bot-token=${TELEGRAM_BOT_TOKEN:}
app.redundant-trail.telegram.chat-id=${TELEGRAM_CHAT_ID:}

app.redundant-trail.sheets.enabled=${REDUNDANT_TRAIL_SHEETS_ENABLED:false}
app.redundant-trail.sheets.spreadsheet-id=${SHEETS_SPREADSHEET_ID:}
app.redundant-trail.sheets.sheet-name=${SHEETS_SHEET_NAME:AuditTrail}
app.redundant-trail.sheets.credentials-base64=${SHEETS_CREDENTIALS_BASE64:}

app.redundant-trail.retry.max-attempts=${REDUNDANT_TRAIL_MAX_ATTEMPTS:5}
app.redundant-trail.retry.fixed-delay-ms=${REDUNDANT_TRAIL_RETRY_DELAY_MS:300000}

app.storage.provider=${STORAGE_PROVIDER:local}

app.storage.local.dir=${STORAGE_LOCAL_DIR:./uploads}
app.storage.local.public-base-url=${STORAGE_LOCAL_PUBLIC_BASE_URL:http://localhost:8080/uploads}



app.storage.imagekit.private-key=${STORAGE_IMAGEKIT_PRIVATE_KEY}
app.storage.imagekit.url-endpoint=${STORAGE_IMAGEKIT_URL_ENDPOINT:https://ik.imagekit.io/n10sj2wm2}

server.port=${PORT:8080}

management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never