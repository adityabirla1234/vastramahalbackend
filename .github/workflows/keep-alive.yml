name: Aiven MySQL Keep-Alive

on:
  schedule:
    # Runs once a day at 5:30 AM UTC. Aiven's free-tier power-off is based
    # on days of total inactivity, not minutes, so a daily ping is enough --
    # no need to run this as often as the Render /actuator/health cron.
    - cron: '30 5 * * *'
  workflow_dispatch: {}   # lets you trigger it manually from the Actions tab to test

jobs:
  ping-aiven:
    runs-on: ubuntu-latest
    steps:
      - name: Install MySQL client
        run: sudo apt-get update && sudo apt-get install -y mysql-client

      - name: Run keep-alive query against Aiven
        run: |
          mysql --host="$DB_HOST" --port="$DB_PORT" --user="$DB_USERNAME" \
                --password="$DB_PASSWORD" --ssl-mode=REQUIRED \
                -e "SELECT NOW();"
        env:
          DB_HOST: ${{ secrets.AIVEN_DB_HOST }}
          DB_PORT: ${{ secrets.AIVEN_DB_PORT }}
          DB_USERNAME: ${{ secrets.AIVEN_DB_USERNAME }}
          DB_PASSWORD: ${{ secrets.AIVEN_DB_PASSWORD }}
